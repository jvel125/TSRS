<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrustedSky — Gate Access</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<nav class="navbar">
  <div class="container navbar-inner">
    <a href="/index.html" class="logo" style="text-decoration:none">
      <svg viewBox="0 0 28 28" fill="none"><path d="M14 3L25 8V14C25 19.5 20 24.2 14 26C8 24.2 3 14V8L14 3Z" stroke="#0ea5e9" stroke-width="2" fill="rgba(14,165,233,.1)"/><path d="M10 14l3 3 5-5" stroke="#0ea5e9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Trusted<span>Sky</span>
    </a>
    <div class="nav-links">
      <a href="/dashboard.html">Dashboard</a>
      <a href="/gate.html" class="active">Gate</a>
      <div id="nav-user"></div>
    </div>
  </div>
</nav>

<div class="container page">
  <div style="max-width:480px;margin:0 auto;text-align:center">

    <!-- Gate display -->
    <div class="card mb-3" style="background:linear-gradient(135deg,var(--surface2),var(--bg2));padding:2rem">
      <div style="font-size:3.5rem;font-weight:700;letter-spacing:-2px;color:var(--blue)" id="gate-display">B12</div>
      <div style="font-size:.8rem;text-transform:uppercase;letter-spacing:2px;color:var(--text-muted);margin-bottom:1rem">Gate</div>
      <div class="form-group" style="text-align:left">
        <label>Gate number</label>
        <input class="form-control" id="gate-input" value="B12" placeholder="e.g. A3, B12, C7">
      </div>
    </div>

    <!-- Gate status indicator -->
    <div id="gate-status-bar" class="card mb-3" style="padding:1rem;display:flex;align-items:center;justify-content:center;gap:.75rem">
      <div id="gate-light" style="width:16px;height:16px;border-radius:50%;background:var(--amber);box-shadow:0 0 12px var(--amber);flex-shrink:0"></div>
      <span id="gate-status-text" style="font-weight:500">Ready to scan</span>
    </div>

    <!-- Camera -->
    <div class="card mb-3">
      <div style="display:flex;flex-direction:column;align-items:center;gap:1.25rem">
        <div class="camera-box" id="cam-box">
          <video id="scan-video" autoplay muted playsinline></video>
          <canvas id="scan-canvas"></canvas>
          <div class="scan-ring hidden" id="scan-ring"></div>
        </div>

        <div class="scan-status">
          <div class="status-icon" id="scan-icon">🛂</div>
          <div class="status-text" id="scan-text">Press the button to scan</div>
        </div>

        <button class="btn btn-primary btn-lg btn-full" id="scan-btn" onclick="startScan()">
          🛂 Scan for gate access
        </button>
      </div>
    </div>

    <!-- Info -->
    <p class="text-muted" style="font-size:.8rem">
      This gate reader verifies that the scanned passenger has a valid check-in for a departing flight. You must be checked in before gate access is granted.
    </p>
  </div>
</div>

<!-- Access result overlay -->
<div class="access-result" id="result-overlay">
  <div class="result-card" id="result-card">
    <div class="result-icon" id="result-icon"></div>
    <div class="result-name" id="result-name"></div>
    <div class="result-sub"  id="result-sub"></div>
    <div id="result-confidence" style="margin-bottom:1.5rem"></div>
    <div id="result-flight"  style="font-size:.875rem;color:var(--text-dim);margin-bottom:1.5rem"></div>
    <button class="btn btn-ghost" onclick="closeResult()">Continue</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.js"></script>
<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/camera.js"></script>
<script>
  requireAuth();
  updateNavUser();

  let cameraStream = null;
  let scanSession  = null;
  let scanning     = false;

  document.getElementById('gate-input').addEventListener('input', (e) => {
    document.getElementById('gate-display').textContent = e.target.value.toUpperCase() || '???';
  });

  async function startScan() {
    if (scanning) return;
    scanning = true;

    const btn  = document.getElementById('scan-btn');
    const ring = document.getElementById('scan-ring');
    btn.disabled = true;
    btn.textContent = 'Scanning…';
    ring.classList.remove('hidden');
    ring.classList.add('active');
    setGateLight('scanning');

    try {
      await FaceEngine.loadModels();
      setScanText('📷', 'Camera starting…');
      cameraStream = await FaceEngine.startCamera(document.getElementById('scan-video'));
      setScanText('👁️', 'Look at the gate camera…');

      scanSession = createScanSession({
        videoEl:      document.getElementById('scan-video'),
        canvasEl:     document.getElementById('scan-canvas'),
        ringEl:       ring,
        onStatus:     (msg) => setScanText('👁️', msg),
        onDescriptor: handleDescriptor,
        onError:      (msg) => { setScanText('⚠️', msg); setGateLight('denied'); resetBtn(); },
      });
    } catch (err) {
      setScanText('⚠️', err.message || 'Camera error');
      setGateLight('denied');
      resetBtn();
    }
  }

  async function handleDescriptor(descriptor) {
    stopCamera();
    setScanText('🔄', 'Checking…');

    const gate = document.getElementById('gate-input').value.trim() || 'Gate B12';

    try {
      const result = await api.gateAccess(descriptor, `Gate ${gate.toUpperCase()}`, 'GATE_ACCESS');
      setGateLight(result.granted ? 'granted' : 'denied');
      showResult(result);
    } catch (err) {
      setScanText('⚠️', err.message);
      setGateLight('denied');
    } finally {
      resetBtn();
    }
  }

  function showResult(result) {
    const overlay = document.getElementById('result-overlay');
    const card    = document.getElementById('result-card');

    document.getElementById('result-icon').textContent = result.granted ? '✅' : '❌';
    document.getElementById('result-name').textContent = result.granted
      ? `${result.first_name} ${result.last_name}`
      : 'Access Denied';
    document.getElementById('result-sub').textContent = result.message;
    document.getElementById('result-confidence').innerHTML =
      `<div style="display:flex;justify-content:center">${confidenceRingHtml(result.confidence)}</div>`;

    if (result.booking) {
      const b = result.booking;
      document.getElementById('result-flight').innerHTML =
        `<strong>${b.flight.origin} → ${b.flight.destination}</strong><br>
         ${b.flight.flight_number} · Seat ${b.seat_number} · ${formatTime(b.flight.departure_time)}`;
    } else {
      document.getElementById('result-flight').textContent = '';
    }

    card.className = `result-card ${result.granted ? 'granted' : 'denied'}`;
    overlay.classList.add('open');

    // Auto-close after 5 s if granted
    if (result.granted) setTimeout(closeResult, 5000);
  }

  function closeResult() {
    document.getElementById('result-overlay').classList.remove('open');
    setGateLight('ready');
  }

  function setGateLight(state) {
    const light = document.getElementById('gate-light');
    const text  = document.getElementById('gate-status-text');
    const map = {
      ready:    ['var(--amber)',  '0 0 12px var(--amber)',  'Ready to scan'],
      scanning: ['var(--blue)',   '0 0 12px var(--blue)',   'Scanning…'],
      granted:  ['var(--green)',  '0 0 16px var(--green)',  'Access Granted'],
      denied:   ['var(--red)',    '0 0 16px var(--red)',    'Access Denied'],
    };
    const [col, shadow, label] = map[state] || map.ready;
    light.style.background  = col;
    light.style.boxShadow   = shadow;
    text.textContent         = label;
    text.style.color         = col;
  }

  function setScanText(icon, text) {
    document.getElementById('scan-icon').textContent = icon;
    document.getElementById('scan-text').textContent = text;
  }

  function stopCamera() {
    if (scanSession) { scanSession.stop(); scanSession = null; }
    FaceEngine.stopCamera(cameraStream);
    cameraStream = null;
  }

  function resetBtn() {
    scanning = false;
    const btn = document.getElementById('scan-btn');
    btn.disabled = false;
    btn.textContent = '🛂 Scan for gate access';
    document.getElementById('scan-ring').classList.remove('active');
  }
</script>
</body>
</html>
