<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrustedSky — Boarding</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<nav class="navbar">
  <div class="container navbar-inner">
    <a href="/index.html" class="logo" style="text-decoration:none">
      <svg viewBox="0 0 28 28" fill="none"><path d="M14 3L25 8V14C25 19.5 20 24.2 14 26C8 24.2 3 14V8L14 3Z" stroke="#0ea5e9" stroke-width="2" fill="rgba(14,165,233,.1)"/><path d="M10 14l3 3 5-5" stroke="#0ea5e9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Trusted<span>Sky</span>
    </a>
    <div class="nav-links">
      <a href="/dashboard.html">Dashboard</a>
      <a href="/boarding.html" class="active">Boarding</a>
      <div id="nav-user"></div>
    </div>
  </div>
</nav>

<div class="container page">
  <div style="max-width:520px;margin:0 auto">

    <div style="margin-bottom:2rem;text-align:center">
      <div style="font-size:3rem;margin-bottom:.5rem">🚪</div>
      <h1>Jetway Boarding</h1>
      <p>Face recognition at the jetway door. Confirmed check-in required to board.</p>
    </div>

    <!-- Flight display -->
    <div class="card mb-3" id="flight-card" style="background:linear-gradient(135deg,var(--surface2),var(--bg2))">
      <div style="display:flex;align-items:center;gap:.75rem" id="flight-info">
        <div class="spinner"></div>
        <span style="color:var(--text-muted)">Loading flight…</span>
      </div>
    </div>

    <!-- Camera card -->
    <div class="card mb-3">
      <div style="display:flex;flex-direction:column;align-items:center;gap:1.25rem">

        <div class="camera-box" id="cam-box">
          <video id="scan-video" autoplay muted playsinline></video>
          <canvas id="scan-canvas"></canvas>
          <div class="scan-ring hidden" id="scan-ring"></div>
        </div>

        <div class="scan-status">
          <div class="status-icon" id="scan-icon">🚪</div>
          <div class="status-text" id="scan-text">Press to scan for boarding</div>
        </div>

        <!-- Boarding light strip -->
        <div id="boarding-strip" style="width:100%;height:4px;border-radius:999px;background:var(--border);transition:background .4s,box-shadow .4s"></div>

        <button class="btn btn-success btn-lg btn-full" id="scan-btn" onclick="startScan()">
          🚪 Scan to board
        </button>
      </div>
    </div>

    <!-- Boarded passenger list (kiosk-style feed) -->
    <div>
      <h3 style="margin-bottom:.75rem">Boarded passengers</h3>
      <div class="card" id="boarded-list">
        <div style="color:var(--text-muted);text-align:center;font-size:.875rem">No boardings yet this session</div>
      </div>
    </div>
  </div>
</div>

<!-- Access result overlay -->
<div class="access-result" id="result-overlay">
  <div class="result-card" id="result-card">
    <div class="result-icon" id="result-icon"></div>
    <div class="result-name" id="result-name"></div>
    <div class="result-sub"  id="result-sub"></div>
    <div id="result-tier"    style="margin-bottom:.75rem"></div>
    <div id="result-seat"    style="font-size:1.1rem;font-weight:600;margin-bottom:1.25rem"></div>
    <div id="result-confidence" style="margin-bottom:1.5rem"></div>
    <button class="btn btn-ghost" onclick="closeResult()">Next passenger</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.js"></script>
<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/camera.js"></script>
<script>
  requireAuth();
  updateNavUser();

  let cameraStream = null;
  let scanSession  = null;
  let scanning     = false;
  const boardedLog = [];

  // Load upcoming flight info
  (async () => {
    try {
      const bookings = await api.myBookings();
      const active = bookings.find(b => b.status === 'CheckedIn') || bookings[0];
      if (active) renderFlightCard(active.flight);
    } catch { /* non-critical */ }
  })();

  function renderFlightCard(f) {
    document.getElementById('flight-info').innerHTML = `
      <div class="flight-route" style="flex:1">
        <div>
          <div style="font-size:1.75rem;font-weight:700">${f.origin}</div>
          <div style="font-size:.75rem;color:var(--text-muted)">${formatDate(f.departure_time)}</div>
        </div>
        <div class="flight-line">
          <div class="flight-number">${f.flight_number}</div>
          <hr>
        </div>
        <div style="text-align:right">
          <div style="font-size:1.75rem;font-weight:700">${f.destination}</div>
          <div style="font-size:.75rem;color:var(--text-muted)">${formatDate(f.arrival_time)}</div>
        </div>
      </div>
      <div style="text-align:right;flex-shrink:0">
        <div style="font-size:.75rem;color:var(--text-muted)">Departure</div>
        <div style="font-weight:600">${formatTime(f.departure_time)}</div>
        <div style="font-size:.8rem;margin-top:.2rem">Gate ${f.gate || '—'}</div>
      </div>
    `;
  }

  async function startScan() {
    if (scanning) return;
    scanning = true;

    const btn  = document.getElementById('scan-btn');
    const ring = document.getElementById('scan-ring');
    btn.disabled = true;
    btn.textContent = 'Scanning…';
    ring.classList.remove('hidden');
    ring.classList.add('active');
    setBoardingLight('scanning');

    try {
      await FaceEngine.loadModels();
      setScanText('📷', 'Camera starting…');
      cameraStream = await FaceEngine.startCamera(document.getElementById('scan-video'));
      setScanText('👁️', 'Look at the boarding camera…');

      scanSession = createScanSession({
        videoEl:      document.getElementById('scan-video'),
        canvasEl:     document.getElementById('scan-canvas'),
        ringEl:       ring,
        onStatus:     (msg) => setScanText('👁️', msg),
        onDescriptor: handleDescriptor,
        onError:      (msg) => { setScanText('⚠️', msg); setBoardingLight('denied'); resetBtn(); },
      });
    } catch (err) {
      setScanText('⚠️', err.message || 'Camera error');
      setBoardingLight('denied');
      resetBtn();
    }
  }

  async function handleDescriptor(descriptor) {
    stopCamera();
    setScanText('🔄', 'Verifying…');

    try {
      const result = await api.gateAccess(descriptor, 'Jetway Door', 'BOARDING');
      setBoardingLight(result.granted ? 'granted' : 'denied');
      showResult(result);

      if (result.granted) {
        addToLog(result);
      }
    } catch (err) {
      setScanText('⚠️', err.message);
      setBoardingLight('denied');
    } finally {
      resetBtn();
    }
  }

  function showResult(result) {
    const overlay = document.getElementById('result-overlay');
    const card    = document.getElementById('result-card');

    document.getElementById('result-icon').textContent = result.granted ? '🛫' : '🚫';
    document.getElementById('result-name').textContent = result.granted
      ? `${result.first_name} ${result.last_name}` : 'Boarding Denied';
    document.getElementById('result-sub').textContent  = result.message;
    document.getElementById('result-tier').innerHTML   = result.tier ? tierBadge(result.tier) : '';
    document.getElementById('result-confidence').innerHTML =
      `<div style="display:flex;justify-content:center">${confidenceRingHtml(result.confidence)}</div>`;

    if (result.booking) {
      document.getElementById('result-seat').textContent =
        `Seat ${result.booking.seat_number} · ${result.booking.seat_class}`;
    } else {
      document.getElementById('result-seat').textContent = '';
    }

    card.className = `result-card ${result.granted ? 'granted' : 'denied'}`;
    overlay.classList.add('open');
    if (result.granted) setTimeout(closeResult, 4000);
  }

  function closeResult() {
    document.getElementById('result-overlay').classList.remove('open');
    setBoardingLight('ready');
  }

  function addToLog(result) {
    boardedLog.unshift(result);
    const list = document.getElementById('boarded-list');
    list.innerHTML = boardedLog.map(r => `
      <div style="display:flex;align-items:center;gap:.75rem;padding:.5rem 0;border-bottom:1px solid var(--border)">
        <span style="font-size:1.25rem">✅</span>
        <div style="flex:1">
          <div style="font-weight:500;font-size:.9rem">${r.first_name} ${r.last_name}</div>
          <div style="font-size:.75rem;color:var(--text-muted)">${r.booking?.seat_number || ''} · ${r.booking?.seat_class || ''}</div>
        </div>
        <span style="font-size:.75rem;color:var(--text-muted)">${formatTime(r.timestamp)}</span>
      </div>
    `).join('');
  }

  function setBoardingLight(state) {
    const strip = document.getElementById('boarding-strip');
    const map = {
      ready:    ['var(--border)',  'none'],
      scanning: ['var(--blue)',    `0 0 12px var(--blue)`],
      granted:  ['var(--green)',   `0 0 16px var(--green)`],
      denied:   ['var(--red)',     `0 0 16px var(--red)`],
    };
    const [bg, shadow] = map[state] || map.ready;
    strip.style.background = bg;
    strip.style.boxShadow  = shadow;
  }

  function setScanText(icon, text) {
    document.getElementById('scan-icon').textContent = icon;
    document.getElementById('scan-text').textContent = text;
  }

  function stopCamera() {
    if (scanSession) { scanSession.stop(); scanSession = null; }
    FaceEngine.stopCamera(cameraStream);
    cameraStream = null;
  }

  function resetBtn() {
    scanning = false;
    const btn = document.getElementById('scan-btn');
    btn.disabled = false;
    btn.textContent = '🚪 Scan to board';
    document.getElementById('scan-ring').classList.remove('active');
  }
</script>
</body>
</html>
